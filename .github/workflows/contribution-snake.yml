name: Update Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: kumarguddu609
          outputs: |
            dist/contribution-snake.svg?palette=github-light
            dist/contribution-snake-dark.svg?palette=github-dark

      - name: Copy generated files
        run: |
          mkdir -p assets
          cp dist/contribution-snake.svg assets/contribution-snake.svg
          cp dist/contribution-snake-dark.svg assets/contribution-snake-dark.svg

      - name: Commit snake assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
